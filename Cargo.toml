[package]
edition = "2021"
rust-version = "1.73.0"
name = "snark-verifier"
version = "0.2.0"
authors = [
    "Privacy Scaling Explorations Team",
    "Intrinsic Technologies",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Generic (S)NARK verifier for Rust, halo2, and EVM. This is a fork of PSE's version."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Case-Traders/snark-verifier"

[features]
default = [
    "loader_evm",
    "loader_halo2",
    "halo2-axiom",
    "display",
]
display = [
    "halo2-base/display",
    "halo2-ecc?/display",
]
halo2-axiom = [
    "halo2-base/halo2-axiom",
    "halo2-ecc?/halo2-axiom",
]
loader_evm = [
    "dep:sha3",
    "dep:ruint",
]
loader_halo2 = ["halo2-ecc"]
parallel = ["dep:rayon"]
revm = [
    "loader_evm",
    "dep:revm",
]

[lib]
name = "snark_verifier"
path = "src/lib.rs"

[[example]]
name = "evm-verifier"
path = "examples/evm-verifier.rs"
required-features = ["loader_evm"]

[[example]]
name = "evm-verifier-with-accumulator"
path = "examples/evm-verifier-with-accumulator.rs"
required-features = [
    "loader_halo2",
    "loader_evm",
]

[[example]]
name = "recursion"
path = "examples/recursion.rs"
required-features = ["loader_halo2"]

[dependencies.halo2-base]
version = "=0.5.0"
default-features = false

[dependencies.halo2-ecc]
version = "=0.5.0"
optional = true
default-features = false

[dependencies.hex]
version = "0.4"

[dependencies.itertools]
